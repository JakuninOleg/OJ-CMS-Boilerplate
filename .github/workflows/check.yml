name: Check OJ CMS
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: oj
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: oj_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oj -d oj_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PAYLOAD_SECRET: ci-test-only-secret-not-for-deployment-32
      DATABASE_URL: postgresql://oj:ci-test-only@127.0.0.1:5432/oj_test
      ALLOW_DISPOSABLE_TEST_DB: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run generate:types && npm run generate:importmap
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run migrate
        env: { NODE_ENV: production }
      - run: npm run test:integration
      - run: npm run build
