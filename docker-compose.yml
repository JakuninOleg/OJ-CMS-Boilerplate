services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oj_cms
      POSTGRES_USER: oj
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - oj-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oj -d oj_cms"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  oj-db:
